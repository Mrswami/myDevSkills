<button
  type="button"
  class="orb"
  [attr.data-status]="node.status"
  [attr.data-type]="node.type"
  [attr.aria-label]="node.title + ' (' + node.status + ')'"
  [class.selected]="skillService.selectedNode()?.id === node.id"
  (click)="onClick()"
  (pointerdown)="$event.stopPropagation()"
>
  <span class="ring"></span>
  <span class="core">
    @switch (node.status) {
      @case ('locked') { <span class="glyph">🔒</span> }
      @case ('mastered') { <span class="glyph">★</span> }
      @default { <span class="glyph">{{ node.title.charAt(0) }}</span> }
    }
  </span>
</button>
<span class="label" [attr.data-status]="node.status">{{ node.title }}</span>
