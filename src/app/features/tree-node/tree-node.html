<button
  type="button"
  class="orb"
  [attr.data-status]="node.status"
  [attr.data-type]="node.type"
  [attr.aria-label]="node.title + ' (' + node.status + ')'"
  [class.selected]="skillService.selectedNode()?.id === node.id"
  (click)="onClick()"
  (pointerdown)="$event.stopPropagation()"
>
  <span class="ring"></span>
  <span class="core"><span class="glyph">{{ glyph() }}</span></span>
</button>
<span class="label" [attr.data-status]="node.status" [attr.data-type]="node.type">{{ node.title }}</span>
