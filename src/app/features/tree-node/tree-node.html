<button
  type="button"
  class="card"
  [attr.data-status]="node.status"
  [attr.data-type]="node.type"
  [attr.aria-label]="node.title + ' (' + node.status + ')'"
  [class.selected]="skillService.selectedNode()?.id === node.id"
  (click)="onClick()"
  (pointerdown)="$event.stopPropagation()"
>
  <span class="border-glow"></span>
  <span class="bg-grid"></span>
  <div class="content">
    <span class="glyph">{{ glyph() }}</span>
    <span class="title">{{ node.title }}</span>
  </div>
</button>
